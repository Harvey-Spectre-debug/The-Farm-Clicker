<html>
<head>
  <title>Farm Clicker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Farm Clicker</h1>

  <button id="upgrade">Upgrade click (cost 25)</button>
  <p class="stat">crops: </p> ---<span id="crops">0</span></p>
  <p class="stat">Crops: <span id="crops2">0</span></p>
  <script src="script.js"></script>
</body>
</html>
